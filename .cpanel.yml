# One-time setup: connect repo in cPanel Git + add GitHub webhook — see DEPLOY.md

deployment:
  tasks:
    - export APP_DIR=/home/serverlinktestwe/public_html/coachnow.serverlinktestwebsites.com
    - export PHP_BIN=/usr/local/bin/php
    - cd $APP_DIR
    - /bin/bash deploy/cpanel-deploy.sh
