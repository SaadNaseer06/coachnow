# Optional fallback — prefer GitHub → cPanel webhook (see DEPLOY.md "One-time setup").
# Only use this if your host does not allow GitHub webhooks to the cPanel deploy URL.
#
# Setup: GitHub → Settings → Secrets → Actions → CPANEL_DEPLOY_URL
# Value: cPanel → Git Version Control → Manage → Pull or Deploy URL

name: Deploy to cPanel (optional)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip if using GitHub webhook directly (recommended in DEPLOY.md)
    if: ${{ secrets.CPANEL_DEPLOY_URL != '' }}
    steps:
      - name: Trigger cPanel pull and deploy
        env:
          CPANEL_DEPLOY_URL: ${{ secrets.CPANEL_DEPLOY_URL }}
        run: |
          curl -fsS -X POST "$CPANEL_DEPLOY_URL"
          echo "cPanel deploy triggered."
