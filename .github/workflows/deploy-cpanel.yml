# Auto-deploy on every push to main.
# One-time setup: add GitHub repository secrets (see DEPLOY.md).

name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (recommended)
        if: ${{ secrets.CPANEL_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_DEPLOY_TOKEN }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          envs: GITHUB_DEPLOY_TOKEN,CPANEL_DEPLOY_PATH
          script: |
            set -e
            APP_DIR="${CPANEL_DEPLOY_PATH:-/home/serverlinktestwe/public_html/coachnow.serverlinktestwebsites.com}"
            cd "$APP_DIR"
            bash deploy/remote-deploy.sh

      - name: Deploy via cPanel webhook (alternative)
        if: ${{ secrets.CPANEL_SSH_HOST == '' && secrets.CPANEL_DEPLOY_URL != '' }}
        env:
          CPANEL_DEPLOY_URL: ${{ secrets.CPANEL_DEPLOY_URL }}
        run: |
          curl -fsS -X POST "$CPANEL_DEPLOY_URL"
          echo "cPanel webhook deploy triggered."

      - name: Deploy secrets not configured
        if: ${{ secrets.CPANEL_SSH_HOST == '' && secrets.CPANEL_DEPLOY_URL == '' }}
        run: |
          echo "::error::No deploy secrets configured."
          echo "Add SSH secrets (recommended) or CPANEL_DEPLOY_URL — see DEPLOY.md"
          exit 1
