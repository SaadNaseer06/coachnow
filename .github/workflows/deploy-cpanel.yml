# Auto-deploy on every push to main.
# One-time setup: add GitHub repository secrets (see DEPLOY.md).

name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: 22
          envs: GITHUB_DEPLOY_TOKEN,CPANEL_DEPLOY_PATH
          script: |
            set -e
            APP_DIR="${CPANEL_DEPLOY_PATH:-/home/serverlinktestwe/public_html/coachnow.serverlinktestwebsites.com}"
            REPO="SaadNaseer06/coachnow"
            BRANCH="main"
            cd "$APP_DIR"

            if [ -n "$GITHUB_DEPLOY_TOKEN" ]; then
              git remote set-url origin "https://x-access-token:${GITHUB_DEPLOY_TOKEN}@github.com/${REPO}.git"
            fi

            git fetch origin "$BRANCH"
            git reset --hard "origin/${BRANCH}"

            if [ -f deploy/cpanel-deploy.sh ]; then
              bash deploy/cpanel-deploy.sh
            elif [ -f deploy/remote-deploy.sh ]; then
              bash deploy/remote-deploy.sh
            else
              echo "Deploy scripts missing after git pull — check repo path and DEPLOY_TOKEN."
              exit 1
            fi
